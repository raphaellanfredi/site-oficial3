name: Diagnose HTTPS

# Runs by hand from the Actions tab, and by itself whenever this file
# changes on main (after the deploy it triggers, on the same runner).
# Read-only: shows which certificate the VPS serves for each host, where
# each address redirects, which services route the domain and what Traefik
# logged about the site's certificate. Prints no secrets.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-https.yml]

jobs:
  diagnose:
    runs-on: self-hosted
    steps:
      - name: DNS
        run: |
          echo "VPS public IP: $(curl -s -m 10 https://api.ipify.org || echo unknown)"
          for h in www.evainteligencia.com.br evainteligencia.com.br; do
            echo "$h -> $(getent ahostsv4 $h | awk '{print $1}' | sort -u | xargs)"
          done

      - name: Certificate served by the VPS
        run: |
          for h in www.evainteligencia.com.br evainteligencia.com.br onboarding-api.evainteligencia.com.br; do
            echo "== $h"
            echo | timeout 15 openssl s_client -connect 127.0.0.1:443 -servername "$h" 2>/dev/null \
              | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null || echo "no certificate"
          done

      - name: Redirects
        run: |
          for u in http://www.evainteligencia.com.br/ http://evainteligencia.com.br/ \
                   https://evainteligencia.com.br/ https://www.evainteligencia.com.br/ \
                   https://www.evainteligencia.com.br/sitemap.xml; do
            h=$(echo "$u" | cut -d/ -f3); p=$([ "${u%%:*}" = https ] && echo 443 || echo 80)
            echo "== $u"
            curl -skI -m 15 --resolve "$h:$p:127.0.0.1" "$u" | grep -iE '^(HTTP|location|content-type)' || echo "no answer"
          done

      - name: Which build each address serves
        run: |
          echo "deployed index.html: $(md5sum < /var/www/eva/dist/public/index.html | cut -c1-12)"
          for h in www.evainteligencia.com.br evainteligencia.com.br; do
            f=$(mktemp); curl -sk -m 15 --resolve "$h:443:127.0.0.1" "https://$h/" -o "$f"
            echo "$h: $(md5sum < "$f" | cut -c1-12) $(grep -o '<title>[^<]*' "$f" | head -1)"
            echo "  insecure references: $(grep -oE '(src|href)="http://[^"]*"' "$f" | sort -u | xargs)"
            rm -f "$f"
          done

      - name: Services that serve the domain
        run: |
          for s in $(docker service ls -q); do
            docker service inspect "$s" --format '{{json .Spec.Labels}}' \
              | grep -qE 'Host\(`(www\.)?evainteligencia\.com\.br`\)' || continue
            docker service inspect "$s" --format \
              'service={{.Spec.Name}} stack={{index .Spec.Labels "com.docker.stack.namespace"}} image={{.Spec.TaskTemplate.ContainerSpec.Image}} created={{.CreatedAt}} updated={{.UpdatedAt}}'
            docker service inspect "$s" --format '{{range .Spec.TaskTemplate.ContainerSpec.Mounts}}  mount {{.Source}} -> {{.Target}}{{"\n"}}{{end}}'
            docker service inspect "$s" --format '{{json .Spec.Labels}}' | tr ',' '\n' \
              | grep -E 'traefik\.http\.(routers|services|middlewares)' | grep -viE 'basicauth|users|password|secret|token' || true
          done

      - name: Routers that mention the domain
        run: |
          for s in $(docker service ls -q); do
            docker service inspect "$s" --format '{{.Spec.Name}} {{json .Spec.Labels}}' \
              | grep -q evainteligencia || continue
            name=$(docker service inspect "$s" --format '{{.Spec.Name}}')
            docker service inspect "$s" --format '{{json .Spec.Labels}}' \
              | grep -oE '"traefik\.http\.routers\.[^"]*\.(rule|entrypoints|tls[^"]*)":"[^"]*"' \
              | sed "s/^/$name  /"
          done

      - name: Traefik configuration and log
        run: |
          t=$(docker service ls --format '{{.Name}} {{.Image}}' | awk 'tolower($2) ~ /traefik/ {print $1; exit}')
          echo "Traefik service: ${t:-not found}"
          [ -n "$t" ] || exit 0
          docker service inspect "$t" --format '{{json .Spec.TaskTemplate.ContainerSpec.Args}}' \
            | tr ',' '\n' | grep -iE 'entrypoints|certificatesresolvers' | grep -viE 'email|token|key' || true
          echo "---- log (last 2h, site and certificates)"
          docker service logs --since 2h --no-task-ids "$t" 2>&1 \
            | grep -iE 'evainteligencia|acme|certificate|letsencrypt' | tail -60 || true
