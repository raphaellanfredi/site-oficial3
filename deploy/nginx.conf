server {
    listen 80;
    server_name www.evainteligencia.com.br;
    root /usr/share/nginx/html;
    index index.html;

    # Static export: every real page exists as a file. Unknown URLs must
    # return a real 404 (with the site's 404 page) instead of the home with
    # status 200, which search engines treat as duplicate content.
    error_page 404 /404.html;

    # Behind Traefik (TLS terminated there), absolute redirects such as
    # /planos -> /planos/ would point to http:// and the container port.
    # Relative redirects keep the visitor on the scheme and host they used.
    absolute_redirect off;

    # The Gênesis concept was previewed at /eden before becoming the home.
    location = /eden { return 301 /; }
    location = /eden/ { return 301 /; }

    # The partners page was taken offline; its address now leads to the
    # affiliate program instead of a 404.
    location = /parceiros { return 301 /afiliados/; }
    location = /parceiros/ { return 301 /afiliados/; }

    # Terms and privacy live in the Help Center; short addresses that
    # people and search engines try lead there instead of a 404.
    location ~ ^/(termos|termos-de-uso|termos-de-servico)/?$ { return 301 https://app.evainteligencia.com.br/hc/central-de-ajuda/articles/1777938226-termos-de-servico; }
    location ~ ^/(privacidade|politica-de-privacidade)/?$ { return 301 https://app.evainteligencia.com.br/hc/central-de-ajuda/articles/1756986596-politica-de-priva; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/font-woff2;
}
