server {
    listen 80;
    server_name www.evainteligencia.com.br;
    root /usr/share/nginx/html;
    index index.html;

    # Static export: every real page exists as a file. Unknown URLs must
    # return a real 404 (with the site's 404 page) instead of the home with
    # status 200, which search engines treat as duplicate content.
    error_page 404 /404.html;

    # Behind Traefik (TLS terminated there), absolute redirects such as
    # /planos -> /planos/ would point to http:// and the container port.
    # Relative redirects keep the visitor on the scheme and host they used.
    absolute_redirect off;

    # The Gênesis concept was previewed at /eden before becoming the home.
    location = /eden { return 301 /; }
    location = /eden/ { return 301 /; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/font-woff2;
}
