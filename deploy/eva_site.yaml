version: "3.8"

services:
  nginx:
    image: nginx:alpine
    volumes:
      - /var/www/eva/dist/public:/usr/share/nginx/html:ro
      - /opt/stacks/eva/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - network_public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.services.eva.loadbalancer.server.port=80"

        # HTTP (port 80): every request moves to HTTPS.
        - "traefik.http.routers.eva.rule=Host(`www.evainteligencia.com.br`) || Host(`evainteligencia.com.br`)"
        - "traefik.http.routers.eva.entrypoints=web"
        - "traefik.http.routers.eva.service=eva"
        - "traefik.http.routers.eva.middlewares=eva-https"
        - "traefik.http.middlewares.eva-https.redirectscheme.scheme=https"
        - "traefik.http.middlewares.eva-https.redirectscheme.permanent=true"

        # HTTPS (port 443) with a Let's Encrypt certificate, the same
        # resolver the onboarding store uses. The domain without www is
        # redirected to www, the site's canonical address.
        - "traefik.http.routers.eva-secure.rule=Host(`www.evainteligencia.com.br`) || Host(`evainteligencia.com.br`)"
        - "traefik.http.routers.eva-secure.entrypoints=websecure"
        - "traefik.http.routers.eva-secure.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.eva-secure.service=eva"
        - "traefik.http.routers.eva-secure.middlewares=eva-www"
        - "traefik.http.middlewares.eva-www.redirectregex.regex=^https://evainteligencia\\.com\\.br/(.*)"
        - "traefik.http.middlewares.eva-www.redirectregex.replacement=https://www.evainteligencia.com.br/$${1}"
        - "traefik.http.middlewares.eva-www.redirectregex.permanent=true"

networks:
  network_public:
    external: true
